# Volume Breakout Strategy / 放量突破
# Risk assessment for breakout signals — verify no hidden risks.

name: volume_breakout
display_name: 放量突破
description: 对 Scanner 识别的放量突破信号进行风险排查，确认突破时无利空压制。
category: trend
core_rules: [1, 3, 4]
required_tools:
  - search_stock_news
  - get_stock_info
  - get_sector_rankings

instructions: |
  **放量突破 — 风险排查视角（Breakout Risk Assessment）**

  当 Scanner 发出放量突破信号时，从以下维度排查风险：

  1. **突破时消息面排查**（核心）：
     - 使用 `search_stock_news` 搜索：
       - 突破是否有消息催化（利好驱动的突破更可靠）
       - 是否存在"利好出尽"风险（如重大合同公告后突破可能是出货）
       - 是否有隐藏利空（减持、诉讼即将公告）

  2. **估值合理性检查**：
     - 使用 `get_stock_info` 检查：
       - 突破后估值是否进入泡沫区域（PE远超行业2倍）
       - 基本面是否支撑更高估值
       - 避免追入"泡沫型突破"

  3. **板块共振确认**：
     - 使用 `get_sector_rankings` 检查：
       - 个股突破是否有板块整体走强配合（板块共振更可靠）
       - 板块若已见顶 → 个股突破可能是假突破

  4. **假突破风险识别**：
     - 突破时是否有异常大单对倒嫌疑
     - 近期是否有多次假突破历史

  评分调整：
  - 突破 + 利好催化 + 板块共振 + 估值合理：sentiment_score +12
  - 板块也在走强：额外 +5
  - 发现利空/估值过高/板块见顶：sentiment_score -12
  - 在 `risk_warning` 中注明突破风险排查结果。
