# Elliott Wave Theory Strategy / 波浪理论
# Risk assessment at wave structure turning points.

name: wave_theory
display_name: 波浪理论
description: 在波浪结构转折点结合宏观周期和消息面判断风险，验证浪型可信度。
category: framework
core_rules: [1, 3, 4]
required_tools:
  - search_stock_news
  - get_stock_info
  - get_sector_rankings

instructions: |
  **波浪理论 — 风险排查视角（Wave Theory Risk Assessment）**

  在波浪结构关键位置进行风险评估：

  1. **浪型转折点消息面验证**（核心）：
     - 使用 `search_stock_news` 搜索：
       - 第2浪底部：下跌是否由利空驱动？利空是否已消化？
       - 第3浪启动：是否有催化剂支撑新一轮上涨？
       - 第5浪末端：是否有利好出尽迹象？
       - B浪反弹：是否存在"诱多"风险？

  2. **宏观周期对照**：
     - 使用 `get_sector_rankings` 评估：
       - 当前行业处于什么周期阶段（扩张/收缩）
       - 板块走势是否支持浪型判断
       - 宏观环境与浪型方向是否一致

  3. **基本面验证**：
     - 使用 `get_stock_info` 确认：
       - 上涨浪需要基本面支撑（业绩增长、行业景气）
       - 调整浪底部需确认基本面未根本恶化
       - C浪下跌中需排查是否有更深层的基本面问题

  4. **风险提示**：
     - 波浪计数存在主观性，消息面验证可提升可信度
     - 第5浪末端追入风险极高
     - B浪反弹不宜重仓

  评分调整建议：
  - 买入浪位 + 利好催化 + 基本面正常：sentiment_score +15
  - 行业周期共振：额外 +5
  - 浪型末端/利空持续/基本面恶化：sentiment_score -12
  - 在 `buy_reason` 中注明波浪位置及消息面验证结果。
