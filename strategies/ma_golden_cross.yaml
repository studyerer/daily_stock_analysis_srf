# MA Golden Cross Strategy / 均线金叉
# Risk assessment when Scanner detects golden cross signals.

name: ma_golden_cross
display_name: 均线金叉
description: 对 Scanner 识别的均线金叉信号进行消息面验证和风险排查。
category: trend
core_rules: [1, 4]
required_tools:
  - search_stock_news
  - get_stock_info

instructions: |
  **均线金叉 — 消息面验证视角（Golden Cross Risk Assessment）**

  当 Scanner 发出均线金叉买入信号时，从以下维度进行风险验证：

  1. **金叉背景验证**（核心）：
     - 使用 `search_stock_news` 搜索：
       - 金叉是否伴随利好消息（业绩、政策、新订单）→ 增加信号可信度
       - 是否存在利空压制（减持、诉讼、监管）→ 金叉可能是假信号
       - 是否有"利好出尽"迹象（重大利好公告后的金叉可能是出货）

  2. **基本面支撑验证**：
     - 使用 `get_stock_info` 检查：
       - 业绩趋势是否支撑股价上行
       - 估值是否合理（PE/PB不应过高）
       - 是否有商誉减值等隐性风险

  3. **假信号风险识别**：
     - 在长期下跌趋势中的金叉 → 弱信号，需更多确认
     - 盘整后金叉 + 无利空 → 较强信号
     - 连续多次金叉死叉 → 震荡市假信号多，降低信心

  评分调整：
  - 金叉 + 利好消息配合 + 基本面正常：sentiment_score +10
  - 金叉 + MACD 零轴上方：额外 +5
  - 发现利空/假信号风险：sentiment_score -10
  - 在 `news_summary` 中注明金叉消息面验证结果。
