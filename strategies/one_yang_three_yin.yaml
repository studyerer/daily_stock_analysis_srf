# One Yang Three Yin Strategy / 一阳夹三阴
# Risk assessment for this K-line pattern — verify fundamentals support reversal.

name: one_yang_three_yin
display_name: 一阳夹三阴
description: 对一阳夹三阴形态信号进行基本面验证和风险排查。
category: pattern
core_rules: [1, 4]
required_tools:
  - search_stock_news
  - get_stock_info

instructions: |
  **一阳夹三阴 — 风险排查视角（Pattern Risk Assessment）**

  当 Scanner 识别到一阳夹三阴形态时，验证反转信号的可信度：

  1. **整理期间消息面排查**（核心）：
     - 使用 `search_stock_news` 搜索：
       - 三阴整理期间是否有利空消息（减持、业绩预警、监管）
       - 第五日阳线是否伴随利好催化
       - 是否存在"利空未出尽"的风险
     - 若整理由利空驱动 → 形态可能是下跌中继，应否决
     - 若整理为正常技术洗盘 → 形态可信度高

  2. **基本面支撑验证**：
     - 使用 `get_stock_info` 检查：
       - 业绩趋势是否正常（支撑趋势延续判断）
       - 估值是否合理
       - 是否有即将发布的重要公告（可能打破形态）

  3. **形态可信度评估**：
     - 上升趋势中的一阳夹三阴 + 无利空 → 高可信度
     - 震荡区域的形态 + 消息面不明 → 中等可信度
     - 下跌趋势中出现 + 有利空 → 低可信度

  评分调整：
  - 形态 + 无利空 + 基本面正常：sentiment_score +12
  - 形态 + 利好催化配合：额外 +5
  - 发现利空驱动/基本面恶化：sentiment_score -10
  - 在 `pattern_analysis` 和 `risk_warning` 中注明验证结果。
