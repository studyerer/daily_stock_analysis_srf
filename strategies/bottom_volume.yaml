# Bottom Volume Surge Strategy / 底部放量
# Risk assessment for potential reversal signals after extended decline.

name: bottom_volume
display_name: 底部放量
description: 对底部放量反转信号进行风险排查，确认是否有持续利空压制。
category: reversal
core_rules: [1, 4]
required_tools:
  - search_stock_news
  - get_stock_info

instructions: |
  **底部放量 — 风险排查视角（Bottom Reversal Risk Assessment）**

  底部反转是高风险信号，风险排查尤为重要：

  1. **下跌原因排查**（核心）：
     - 使用 `search_stock_news` 搜索：
       - 前期下跌是否由持续利空驱动（如行业政策打压、业绩持续恶化）
       - 利空因素是否已消除或充分消化
       - 是否有新的利好催化（政策转向、业绩拐点）
     - 若利空因素仍在持续 → 底部放量可能只是"下跌中继"，应否决。

  2. **基本面底部确认**：
     - 使用 `get_stock_info` 检查：
       - 业绩是否已触底（最新季度是否环比改善）
       - 是否存在退市风险（连续亏损、审计意见）
       - 现金流是否健康（避免流动性危机）

  3. **主力行为判断**：
     - 底部放量是主力建仓还是最后的恐慌抛售？
     - 若放量伴随阳线且守住低点 → 倾向建仓
     - 若放量但持续创新低 → 倾向恐慌出逃

  4. **风险提示**：
     - 反转信号风险高于趋势跟踪，建议小仓位。
     - 止损必须严格。

  评分调整：
  - 利空消除 + 基本面触底 + 放量阳线：sentiment_score +8
  - 有新催化（政策/业绩拐点）：额外 +5
  - 利空持续 / 退市风险：sentiment_score -20，建议否决
  - 在 `risk_warning` 中注明底部放量风险评估结果。
