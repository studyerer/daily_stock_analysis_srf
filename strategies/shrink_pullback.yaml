# Shrink Volume Pullback Strategy / 缩量回踩
# Risk assessment for pullback entries identified by Scanner.

name: shrink_pullback
display_name: 缩量回踩
description: 对 Scanner 识别的缩量回踩信号进行风险排查，确认回调期间无利空。
category: trend
core_rules: [1, 4]
required_tools:
  - search_stock_news
  - get_stock_info
  - get_sector_rankings

instructions: |
  **缩量回踩 — 风险排查视角（Pullback Risk Assessment）**

  当 Scanner 发出缩量回踩买入信号时，从以下维度排查风险：

  1. **回调原因排查**（核心）：
     - 使用 `search_stock_news` 搜索回调期间是否有利空消息驱动：
       - 减持公告、业绩预警、诉讼、监管问题
       - 行业政策变化（集采、限价、反垄断）
     - 若回调由利空驱动 → 这不是"洗盘"而是"出逃"，应否决。
     - 若回调期间无明显利空 → 支持"正常技术回调"判断。

  2. **基本面验证**：
     - 使用 `get_stock_info` 检查：
       - 近期业绩预告是否正常
       - ROE/营收增速是否仍在合理区间
       - 是否有商誉减值风险

  3. **行业环境确认**：
     - 使用 `get_sector_rankings` 确认：
       - 个股回调是否为板块整体调整（系统性vs个股性）
       - 板块整体景气度是否仍然向好

  4. **减持与解禁排查**：
     - 近期是否有大额解禁
     - 股东/高管是否有减持计划

  评分调整：
  - 回调期间无利空、基本面正常：sentiment_score +8
  - 板块整体仍强、个股跟随调整：额外 +5
  - 发现利空驱动回调：sentiment_score -15，建议否决
  - 在 `risk_warning` 中注明回调原因排查结果。
