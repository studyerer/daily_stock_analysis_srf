# Chan Theory Strategy / 缠论
# Risk assessment at structural turning points identified by Chan Theory.

name: chan_theory
display_name: 缠论
description: 在缠论结构转折点进行消息面确认和风险排查，验证买卖点可信度。
category: framework
core_rules: [1, 4]
required_tools:
  - search_stock_news
  - get_stock_info
  - get_sector_rankings

instructions: |
  **缠论 — 风险排查视角（Chan Theory Risk Assessment）**

  当缠论分析识别到买卖点时，从消息面和基本面验证信号可信度：

  1. **买点消息面验证**（核心）：
     - 使用 `search_stock_news` 搜索：
       - 一买（底背驰）：下跌是否由持续利空驱动？利空是否已消除？
       - 二买（回调不破）：回调期间是否有新的利空？
       - 三买（突破中枢）：突破是否有催化剂支撑？
     - 若结构买点伴随利空消除/利好催化 → 信号可信度高
     - 若结构买点但利空仍在持续 → 可能是"技术陷阱"

  2. **卖点消息面确认**：
     - 一卖（顶背驰）：是否有利好出尽迹象？
     - 高位中枢震荡：是否有减持/解禁等资金面压力？

  3. **基本面验证**：
     - 使用 `get_stock_info` 确认：
       - 买入信号需基本面至少不恶化
       - 业绩趋势是否支持结构转折方向

  4. **行业共振验证**：
     - 使用 `get_sector_rankings` 确认：
       - 个股转折点是否有行业趋势共振
       - 板块走势与个股结构是否方向一致

  评分调整建议：
  - 结构买点 + 利好催化 + 基本面正常：sentiment_score +15
  - 多级别共振 + 行业景气：额外 +5
  - 利空持续 / 基本面恶化：sentiment_score -15
  - 在 `buy_reason` 中注明缠论结构及消息面验证结果。
