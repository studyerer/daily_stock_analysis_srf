# Box Range Trading Strategy / 箱体震荡战法
# Risk assessment for range-bound stocks — focus on catalysts and risks.

name: box_oscillation
display_name: 箱体震荡
description: 对箱体震荡股票进行风险排查，关注可能导致箱体破位的催化剂或利空。
category: framework
core_rules: [1, 4]
required_tools:
  - search_stock_news
  - get_stock_info
  - get_sector_rankings

instructions: |
  **箱体震荡 — 风险排查视角（Box Range Risk Assessment）**

  当 Scanner 识别到箱体震荡形态时，从以下维度进行风险评估：

  1. **箱体破位催化剂排查**（核心）：
     - 使用 `search_stock_news` 搜索：
       - 是否有可能导致向下破位的利空（减持、业绩预警、监管）
       - 是否有可能推动向上突破的利好（新订单、政策、业绩超预期）
       - 震荡期间是否有资金流出迹象（大股东减持/高管离职）

  2. **基本面稳定性**：
     - 使用 `get_stock_info` 检查：
       - 箱体震荡期间基本面是否稳定
       - 即将发布的业绩报告预期
       - 是否有商誉/应收账款等隐性风险

  3. **行业环境**：
     - 使用 `get_sector_rankings` 判断：
       - 板块是否在酝酿方向选择
       - 行业政策是否有变化预期

  4. **箱体有效性风险**：
     - 长期箱体（>3个月）若突然放量 → 方向选择信号
     - 箱体底部若有大额解禁日 → 警惕向下破位

  评分调整建议：
  - 箱底 + 无利空 + 基本面稳定：sentiment_score +10
  - 有利好催化可能推动突破：额外 +5
  - 发现利空催化或破位风险：sentiment_score -12
  - 在 `risk_warning` 中注明箱体风险评估结果。
