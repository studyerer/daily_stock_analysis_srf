# Default Bull Trend Strategy / 默认多头趋势
# Risk assessment for bullish trend stocks.

name: bull_trend
display_name: 默认多头趋势
description: 默认个股分析策略，对趋势向上的股票进行风险评估与情报补充。
category: trend
core_rules: [1, 2, 3]
required_tools:
  - search_stock_news
  - get_stock_info
  - get_sector_rankings

instructions: |
  **默认多头趋势 — 风险评估视角（Bull Trend Risk Assessment）**

  适用场景：
  - 常规个股分析的默认策略。
  - 对 Scanner 筛出的趋势向上股票进行风险审查。

  风险评估框架：

  1. **重大风险一票否决排查**（优先级最高）
     - 使用 `search_stock_news` 排查：
       - 减持公告、业绩预亏、监管处罚、立案调查
       - 行业重大政策利空
       - 大额解禁且有减持计划
     - 任一项成立 → 直接否决。

  2. **基本面健康度**
     - 使用 `get_stock_info` 评估：
       - ROE趋势（是否持续下降）
       - 营收增速、毛利率趋势
       - 商誉占比、大股东质押比例
     - 基本面恶化 → 降低评分。

  3. **行业景气度**
     - 使用 `get_sector_rankings` 判断：
       - 板块是否处于主升期（提升信心）
       - 板块是否持续走弱（降低信心）
       - 行业政策风向

  4. **利好催化识别**
     - 业绩超预期、新产品/订单、政策扶持
     - 机构调研密集/评级上调

  评分调整建议：
  - 无风险 + 基本面健康 + 行业景气：sentiment_score +12
  - 有利好催化：额外 sentiment_score +8
  - 存在风险预警项：sentiment_score -10
  - 存在否决项：直接建议"观望"
